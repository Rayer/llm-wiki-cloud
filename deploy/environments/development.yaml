gcp:
  project_id: llm-wiki-cloud
  region: asia-east1
  artifact_registry: asia-east1-docker.pkg.dev/llm-wiki-cloud/cloud-run-images

auth:
  google:
    enabled: true
    client_id: 580854833715-vo7fg6f7f15g1kkgchk1ulccllbc24qg.apps.googleusercontent.com
    client_secret_reference: google-oauth-client-dev
    client_secret_version: "1"
    issuer: https://accounts.google.com
    jwks_url: https://www.googleapis.com/oauth2/v3/certs
    token_url: https://oauth2.googleapis.com/token
    login_redirect_url: https://auth.dev.rayer.idv.tw/api/v1/auth/google/callback
    link_redirect_url: https://auth.dev.rayer.idv.tw/api/v1/auth/google/link/callback
    completion_url: https://wiki.dev.rayer.idv.tw/login
  service_name: llm-wiki-auth-dev
  runtime_service_account: lwc-auth-dev@llm-wiki-cloud.iam.gserviceaccount.com
  network: default
  subnet: default
  vpc_egress: private-ranges-only
  ingress: all
  max_instances: 1
  firestore_database_id: llm-wiki-cloud-dev
  # Environment-scoped Demo identity, shared by Auth startup and BFF restrictions.
  demo_user_id: "e492f6bdaf1735e12b2de96d"
  demo_user_email: "demo@llm-wiki.dev"
  demo_user_role: member
  public_domain: auth.dev.rayer.idv.tw
  allowed_hosts:
    - auth.dev.rayer.idv.tw
    - auth-dev.rayer.idv.tw
  allowed_origins:
    - https://wiki.dev.rayer.idv.tw
    - https://llm-wiki-frontend-dev.vercel.app
    - http://localhost:3000
  secret_references:
    jwt: jwt-secret-dev

bff:
  service_name: llm-wiki-bff-dev
  runtime_service_account: lwc-bff-dev@llm-wiki-cloud.iam.gserviceaccount.com
  network: default
  subnet: default
  vpc_egress: private-ranges-only
  ingress: all
  max_instances: 1
  pipeline_job_name: olw-pipeline-dev
  pipeline_job_location: asia-east1

worker:
  job_name: olw-pipeline-dev
  runtime_service_account: lwc-pipeline-dev@llm-wiki-cloud.iam.gserviceaccount.com
  bucket: llm-wiki-data-dev
  location: asia-east1
  args:
    - run
    - '[["run","--auto-approve"]]'
  secret_references:
    deepseek_api_key: deepseek-apikey

export_job:
  enabled: true
  job_name: export-job-dev
  runtime_service_account: lwc-export-worker-dev@llm-wiki-cloud.iam.gserviceaccount.com
  bucket: llm-wiki-data-dev
  firestore_database_id: llm-wiki-cloud-dev
  location: asia-east1
  signing_service_account: lwc-export-signer-dev@llm-wiki-cloud.iam.gserviceaccount.com
  job_timeout: 23h
  max_retries: 0
  parallelism: 1
  tasks: 1

frontend:
  project_name: llm-wiki-frontend-dev
  team_slug: rayer-tung-s-projects
  repository: Rayer/llm-wiki-cloud
  root_directory: apps/frontend
  stable_aliases:
    - wiki.dev.rayer.idv.tw
  api_url: https://llm-wiki-bff-dev-580854833715.asia-east1.run.app
  auth_url: https://auth.dev.rayer.idv.tw
