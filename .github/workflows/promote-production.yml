name: Promote Production
on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated selected components; config-only always targets Worker
        required: false
        type: string
      release_tag:
        description: Explicit immutable release tag; not used by config-only
        required: false
        type: string
      artifact_id:
        description: Optional retained artifact ID for reuse
        type: string
        default: ''
      dev_artifact_id:
        description: Explicit successful DEV result artifact (required for Production containers)
        type: string
        default: ''
      operation:
        description: Config-only updates Pipeline settings without changing its image
        required: true
        type: choice
        options: [release, config-only]
        default: release
      pipeline_run_timeout_seconds:
        description: Verified existing Worker Job timeout in seconds; required for Pipeline config generation
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      environment: production
      source_sha: ${{ github.sha }}
      executor_sha: ${{ github.sha }}
      components: ${{ inputs.components }}
      release_tag: ${{ inputs.release_tag }}
      artifact_id: ${{ inputs.artifact_id }}
      dev_artifact_id: ${{ inputs.dev_artifact_id }}
      operation: ${{ inputs.operation }}
      pipeline_run_timeout_seconds: ${{ inputs.pipeline_run_timeout_seconds }}
