name: Promote Production
run-name: ${{ inputs.prepare_release_notes_package && format('Prepare Release Notes package {0}', inputs.release_notes_package_request_id) || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated selected components; config-only targets Worker and frontend-config-only publishes a public config artifact
        required: false
        type: string
      release_tag:
        description: Explicit immutable release tag; not used by config-only
        required: false
        type: string
      release_version:
        description: Explicit public product release version; included in the immutable release plan and never inferred from the tag or BFF build
        required: false
        type: string
        default: ''
      artifact_id:
        description: Optional retained artifact ID for reuse
        type: string
        default: ''
      release_notes_artifact_id:
        description: Exact retained TPM-authored private Release Notes package artifact ID
        type: string
        default: ''
      release_notes_action:
        description: Explicit Notes subphase choice; retry/skip are bound to this release plan, stop ends before product mutation
        required: true
        type: choice
        options: [run, retry, skip, stop]
        default: run
      release_notes_result_artifact_id:
        description: Exact retained release result artifact ID for operation notes-resend
        type: string
        default: ''
      release_notes_operation:
        description: Original retained runtime operation used only by notes-resend
        type: string
        default: release
      dev_artifact_id:
        description: Explicit successful DEV result artifact (required for Production containers)
        type: string
        default: ''
      frontend_config_artifact_id:
        description: Exact successful public Frontend config artifact ID; required for frontend-config-only
        type: string
        default: ''
      operation:
        description: Config-only updates Pipeline settings; frontend-config-only publishes the selected public Frontend config without rebuilding; frontend-config-generate prepares an immutable public config artifact
        required: true
        type: choice
        options: [release, config-only, frontend-config-only, frontend-config-generate, notes-resend]
        default: release
      pipeline_run_timeout_seconds:
        description: Verified existing Worker Job timeout in seconds; required for Pipeline config generation
        type: string
        default: ''
      release_source_mode:
        description: Explicit image receipt mode; legacy_monorepo is restricted to retained legacy receipts
        required: true
        type: choice
        options: [independent, legacy_monorepo]
        default: independent
      auth_schema_version:
        description: Auth runtime input schema for Production; schema 3 is limited to independent Auth-only releases
        required: false
        type: string
        default: '4'
      prepare_release_notes_package:
        description: Prepare a TPM-authored private Notes package from an exact current Production Ready artifact; skips every deployment operation
        required: false
        type: boolean
        default: false
      package_zip_base64:
        description: Private bounded base64 ZIP of the existing TPM-authored Notes package; consumed from this dispatch event file only
        required: false
        type: string
        default: ''
      release_notes_package_request_id:
        description: Unique lowercase 32-hex correlation value for private package preparation
        required: false
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  prepare-release-notes-package:
    if: github.ref == 'refs/heads/main' && inputs.prepare_release_notes_package == true
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/prepare-release-notes-package.yml
    with:
      ready_artifact_id: ${{ inputs.artifact_id }}
      history_result_artifact_id: ''
      history_operation: ''
      retention_days: '90'
      request_id: ${{ inputs.release_notes_package_request_id }}
  release:
    if: github.ref == 'refs/heads/main' && inputs.prepare_release_notes_package != true && inputs.operation != 'frontend-config-generate'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      environment: production
      source_sha: ${{ github.sha }}
      executor_sha: ${{ github.sha }}
      components: ${{ inputs.components }}
      release_tag: ${{ inputs.release_tag }}
      release_version: ${{ inputs.release_version }}
      release_source_mode: ${{ inputs.release_source_mode }}
      auth_schema_version: ${{ inputs.auth_schema_version }}
      artifact_id: ${{ inputs.artifact_id }}
      release_notes_artifact_id: ${{ inputs.release_notes_artifact_id }}
      release_notes_result_artifact_id: ${{ inputs.release_notes_result_artifact_id }}
      release_notes_action: ${{ inputs.release_notes_action }}
      release_notes_operation: ${{ inputs.release_notes_operation }}
      dev_artifact_id: ${{ inputs.dev_artifact_id }}
      frontend_config_artifact_id: ${{ inputs.frontend_config_artifact_id }}
      operation: ${{ inputs.operation }}
      pipeline_run_timeout_seconds: ${{ inputs.pipeline_run_timeout_seconds }}
  frontend-config-generate:
    if: github.ref == 'refs/heads/develop' && inputs.prepare_release_notes_package != true && inputs.operation == 'frontend-config-generate'
    permissions:
      contents: read
    uses: ./.github/workflows/generate-frontend-config.yml
    with:
      environment: prod
