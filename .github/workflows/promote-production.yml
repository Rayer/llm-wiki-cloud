name: Promote Production
on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated selected components
        required: true
        type: string
      release_tag:
        description: Explicit immutable release tag
        required: true
        type: string
      artifact_id:
        description: Optional retained artifact ID for reuse
        type: string
        default: ''
      dev_artifact_id:
        description: Explicit successful DEV result artifact (required for Production containers)
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      environment: production
      source_sha: ${{ github.sha }}
      components: ${{ inputs.components }}
      release_tag: ${{ inputs.release_tag }}
      artifact_id: ${{ inputs.artifact_id }}
      dev_artifact_id: ${{ inputs.dev_artifact_id }}
