name: Vercel Production Alias Promotion

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character lowercase SHA already deployed by Vercel
        required: true
        type: string
      deployment_id:
        description: Immutable READY Vercel deployment ID to receive both aliases
        required: true
        type: string
      ticket_ref:
        description: Optional ticket reference retained as evidence metadata
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production-alias-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and promote bounded production aliases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      TICKET_REF: ${{ inputs.ticket_ref }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ORIGINATING_WORKFLOW: vercel-alias-promotion.yml
      ORIGINATING_WORKFLOW_RUN_ID: ${{ github.run_id }}
      ORIGINATING_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      EVIDENCE_DIR: ${{ runner.temp }}/vercel-alias-promotion
    steps:
      - name: Check out workflow-owned helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Install pinned Vercel CLI
        shell: bash
        run: npm install --global vercel@52.0.0 --ignore-scripts

      - name: Validate and promote exact deployment
        shell: bash
        run: bash .github/scripts/vercel-alias-promotion.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload normalized deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-alias-promotion-evidence
          path: ${{ runner.temp }}/vercel-alias-promotion/vercel-alias-promotion.json
          if-no-files-found: error
