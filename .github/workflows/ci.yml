name: canonical-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bff:
    name: bff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Validate product version
        run: go run ./cmd/versioncheck VERSION
      - name: Validate monorepo CD contract
        run: python3 ../../scripts/test_cd_contract.py
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./... -v -count=1 -race
      - name: Go build
        run: go build ./...

  lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  local-smoke:
    name: local-vertical-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Bootstrap local dependencies
        run: make bootstrap
      - name: Run local vertical smoke
        run: make smoke

  workflow-source:
    name: workflow-source-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - name: Parse canonical workflow YAML
        run: make workflow-yaml
      - name: Check smoke script syntax
        run: bash -n scripts/local-vertical-smoke.sh
      - name: Run imported workflow guard tests
        run: node --experimental-strip-types --test tests/ci-workflow-contract.test.mjs
        working-directory: apps/frontend

  build:
    name: canonical-ci
    if: ${{ always() }}
    needs: [bff, frontend-build, local-smoke, workflow-source]
    runs-on: ubuntu-latest
    steps:
      - name: Require every canonical job
        run: |
          set -euo pipefail
          test "${{ needs.bff.result }}" = success
          test "${{ needs.frontend-build.result }}" = success
          test "${{ needs.local-smoke.result }}" = success
          test "${{ needs.workflow-source.result }}" = success
