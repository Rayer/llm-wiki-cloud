name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  main-fast-forward-eligible:
    name: main-fast-forward-eligible
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify develop contains main
        id: verify
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          candidate_sha="$(git rev-parse HEAD)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$candidate_sha" = "$GITHUB_SHA"
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$candidate_sha" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$candidate_sha"
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Publish main fast-forward eligibility status
        if: success() && needs.build.result == 'success'
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          head_sha="$(git rev-parse HEAD)"
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$head_sha" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$CANDIDATE_SHA"
          curl --fail --silent --show-error --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"state":"success","context":"main-fast-forward-eligible","description":"Exact develop head is eligible for main fast-forward"}'
