name: canonical-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bff:
    name: bff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Validate product version
        run: go run ./cmd/versioncheck VERSION
      - name: Validate BFF promotion contract
        run: python3 scripts/test_bff_promotion_contract.py
      - name: Execute BFF production cutover harness
        run: python3 scripts/test_bff_explicit_cutover.py
      - name: Validate Auth promotion contract
        run: python3 scripts/test_auth_promotion_contract.py
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./... -v -count=1 -race
      - name: Go build
        run: go build ./...

  lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  local-smoke:
    name: local-vertical-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Bootstrap local dependencies
        run: make bootstrap
      - name: Run local vertical smoke
        run: make smoke

  workflow-source:
    name: workflow-source-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - name: Parse canonical workflow YAML
        run: make workflow-yaml
      - name: Check smoke script syntax
        run: bash -n scripts/local-vertical-smoke.sh
      - name: Run imported workflow guard tests
        run: node --experimental-strip-types --test tests/ci-workflow-contract.test.mjs
        working-directory: apps/frontend

  build:
    name: canonical-ci
    if: ${{ always() }}
    needs: [bff, frontend-build, local-smoke, workflow-source]
    runs-on: ubuntu-latest
    steps:
      - name: Require every canonical job
        run: |
          set -euo pipefail
          test "${{ needs.bff.result }}" = success
          test "${{ needs.frontend-build.result }}" = success
          test "${{ needs.local-smoke.result }}" = success
          test "${{ needs.workflow-source.result }}" = success

  main-fast-forward-eligible-pending:
    name: main-fast-forward-eligible-pending
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish pending main fast-forward eligibility status
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" --field state=pending --field context=main-fast-forward-eligible --field description='Validating exact develop head for main fast-forward eligibility'

  main-fast-forward-eligible:
    name: main-fast-forward-eligible
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    needs: [build, main-fast-forward-eligible-pending]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify develop contains main
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PENDING_RESULT: ${{ needs.main-fast-forward-eligible-pending.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          test "$PENDING_RESULT" = "success"
          candidate_sha="$GITHUB_SHA"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "$candidate_sha"
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$candidate_sha" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$candidate_sha"
      - name: Publish main fast-forward eligibility status
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          head_sha="$(git rev-parse HEAD)"
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$head_sha" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$CANDIDATE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" --field state=success --field context=main-fast-forward-eligible --field description='Exact develop head is eligible for main fast-forward'
      - name: Publish main fast-forward ineligible status after failure
        if: ${{ failure() || cancelled() }}
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" --field state=failure --field context=main-fast-forward-eligible --field description='Develop head is not eligible for main fast-forward'
