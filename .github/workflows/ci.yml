name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  main-fast-forward-eligible:
    name: main-fast-forward-eligible
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Revoke stale main fast-forward eligibility status
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" --field state=pending --field context=main-fast-forward-eligible --field description='Validating exact develop head for main fast-forward eligibility'
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify develop contains main
        if: needs.build.result == 'success'
        run: |
          set -euo pipefail
          candidate_sha="$GITHUB_SHA"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "$candidate_sha"
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$candidate_sha" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$candidate_sha"
      - name: Publish main fast-forward eligibility status
        if: needs.build.result == 'success'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin refs/heads/main refs/heads/develop
          head_sha="$(git rev-parse HEAD)"
          remote_develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          test "$head_sha" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "$remote_develop_sha"
          git merge-base --is-ancestor refs/remotes/origin/main "$CANDIDATE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" --field state=success --field context=main-fast-forward-eligible --field description='Exact develop head is eligible for main fast-forward'
