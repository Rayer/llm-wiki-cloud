name: Deployment engine r2
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      executor_sha:
        required: true
        type: string
      components:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      operation:
        type: string
        default: release
      artifact_id:
        type: string
        default: ''
      dev_artifact_id:
        type: string
        default: ''
      force:
        type: boolean
        default: false
concurrency:
  group: lwc-engine-${{ inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: inputs.operation != 'diagnose-auth-image'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      TARGET: ${{ inputs.environment }}
      SOURCE: ${{ inputs.source_sha }}
      EXECUTOR_SHA: ${{ inputs.executor_sha }}
      COMPONENTS: ${{ inputs.components }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REUSE_ID: ${{ inputs.artifact_id }}
      DEV_ID: ${{ inputs.dev_artifact_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      OPERATION: ${{ inputs.operation }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate executor checkout
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: inputs.operation == 'release'
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install artifact transport and pinned Vercel CLI
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/lwc-tools/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/lwc-tools" @actions/artifact@2.3.2 --ignore-scripts
          npm install --global vercel@59.11.7 --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Resolve explicit receipt references and prepare selected artifacts
        if: inputs.operation == 'release'
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        with:
          operation: prepare
      - name: Publish ready stage barrier
        if: inputs.operation == 'release'
        id: ready
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-ready-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: error

      - name: Validate explicit recovery inputs
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ['OPERATION'] in ('deploy', 'rollback', 'reactivate', 'tag', 'readback')
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['ARTIFACT_ID'])
          PY
      - name: Download pinned ready artifact or checkpoint
        if: inputs.operation != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/engine/artifacts.cjs download "$ARTIFACT_ID" "$RUNNER_TEMP/release"
      - name: Validate pinned workflow interface
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/release/plan.json'))
          assert p['normalized']['environment']==os.environ['TARGET']
          assert p['source']==os.environ['SOURCE'] and p['tag']==os.environ['RELEASE_TAG']
          assert os.environ['OPERATION'] in ('release','deploy','rollback','reactivate','tag','readback')
          if os.environ.get('FORCE') == 'true':
              assert os.environ['TARGET'] == 'development'
              assert os.environ['OPERATION'] in ('release','deploy')
          PY
      - name: Execute bounded runtime or explicit recovery
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        with:
          operation: runtime
          force: ${{ inputs.force }}
      - name: Retain final result even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-result-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: warn
