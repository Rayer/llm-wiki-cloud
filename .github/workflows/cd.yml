name: Deployment engine r2
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string
        description: Deployment source SHA; a DEV Stage 1 resume supplies the retained plan source while executor_sha remains the current reviewed checkout
      release_source_mode:
        required: true
        type: string
        description: Explicit receipt mode; legacy_monorepo supports retained receipts and the current same-repository GAT-4 DEV stage; this does not change Production policy
      auth_schema_version:
        required: false
        type: string
        default: '4'
        description: Auth runtime input schema; schema 3 is limited to independent Auth-only DEV/Production or BFF-only DEV staging with a retained schema-3 Auth receipt
      auth_repository_id:
        required: false
        type: number
        default: 0
        description: Immutable GitHub repository ID for the independent GateAuth source
      auth_revision:
        required: false
        type: string
        default: ''
        description: Full GateAuth source commit SHA
      auth_tree_sha256:
        required: false
        type: string
        default: ''
        description: SHA-256 of the clean GateAuth source tree
      auth_artifact_id:
        required: false
        type: number
        default: 0
        description: Source artifact ID from the successful GateAuth workflow run
      auth_run_id:
        required: false
        type: number
        default: 0
        description: Successful GateAuth workflow run ID which produced the source artifact
      auth_run_attempt:
        required: false
        type: number
        default: 0
        description: Successful GateAuth workflow run attempt
      executor_sha:
        required: true
        type: string
      components:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_version:
        required: false
        type: string
        default: ''
        description: Explicit public product release version included in new schema-4 plans; never inferred from BFF build or tag
      operation:
        type: string
        default: release
        description: Select normal deployment, Pipeline config-only, or public Frontend config-only publication
      artifact_id:
        type: string
        default: ''
      rejection_artifact_id:
        type: string
        default: ''
        description: Exact retained DEV result artifact containing a machine-verifiable Vercel quota rejection
      release_notes_artifact_id:
        required: false
        type: string
        default: ''
        description: Exact retained TPM-authored private Release Notes package artifact ID
      release_notes_result_artifact_id:
        required: false
        type: string
        default: ''
        description: Exact retained deployment result artifact ID for an independent Notes resend
      release_notes_action:
        required: false
        type: string
        default: run
        description: Explicit Owner disposition; run/retry performs Notes work, while skip/stop in notes-resend records a no-deploy choice
      release_notes_operation:
        required: false
        type: string
        default: release
        description: Original retained operation identity used only by Notes resend
      dev_artifact_id:
        type: string
        default: ''
      frontend_config_artifact_id:
        type: string
        default: ''
        description: Exact successful artifact ID from Generate Frontend Public Config
      force:
        type: boolean
        default: false
      pipeline_run_timeout_seconds:
        type: string
        default: ''
        description: Verified existing Pipeline Job timeout in seconds; required for worker config generation
concurrency:
  group: lwc-engine-${{ inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: inputs.operation != 'diagnose-auth-image' && inputs.operation != 'config-only' && inputs.operation != 'frontend-config-only' && inputs.operation != 'notes-resend'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      TARGET: ${{ inputs.environment }}
      SOURCE: ${{ inputs.source_sha }}
      EXECUTOR_SHA: ${{ inputs.executor_sha }}
      GAT4_RELEASE_SOURCE_MODE: ${{ inputs.release_source_mode }}
      GAT4_DEV_RECEIPT_MODE: ${{ inputs.release_source_mode }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      COMPONENTS: ${{ inputs.components }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      REUSE_ID: ${{ inputs.artifact_id }}
      DEV_ID: ${{ inputs.dev_artifact_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      RELEASE_NOTES_ARTIFACT_ID: ${{ inputs.release_notes_artifact_id }}
      RELEASE_NOTES_RESULT_ARTIFACT_ID: ${{ inputs.release_notes_result_artifact_id }}
      RELEASE_NOTES_ACTION: ${{ inputs.release_notes_action }}
      RELEASE_NOTES_OPERATION: ${{ inputs.release_notes_operation }}
      REJECTION_ARTIFACT_ID: ${{ inputs.rejection_artifact_id }}
      OPERATION: ${{ inputs.operation }}
      FORCE: ${{ inputs.force }}
      LWC_PIPELINE_RUN_TIMEOUT_SECONDS: ${{ inputs.pipeline_run_timeout_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate executor checkout
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
      - name: Select independent DEV receipt producer
        if: inputs.environment == 'development' && inputs.release_source_mode == 'independent'
        run: echo "GAT4_DEV_RECEIPT_SOURCE_METADATA_FILE=$RUNNER_TEMP/release/dev-source-metadata.json" >> "$GITHUB_ENV"
      - name: Validate retained Stage 1 source input
        if: inputs.operation == 'release' && inputs.environment == 'development' && inputs.source_sha != github.sha
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || {
            echo "An explicit DEV Stage 1 source requires its retained artifact_id." >&2
            exit 1
          }
      - name: Validate explicit public release version
        if: inputs.operation == 'release'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REUSE_ID: ${{ inputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import os, re
          value=os.environ['RELEASE_VERSION']
          reuse_id=os.environ.get('REUSE_ID','')
          if value == '' and re.fullmatch(r'[1-9][0-9]*', reuse_id):
              # Engine admission verifies the exact retained legacy plan and all request identities.
              raise SystemExit(0)
          pattern=r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
          match=re.fullmatch(pattern, value)
          if not match or any(part.isdigit() and len(part)>1 and part.startswith('0') for part in (match.group(4) or '').split('.')):
              raise SystemExit('An explicit valid release_version is required for release operations.')
          PY
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - name: Prepare native Auth input identity validator modules
        working-directory: apps/bff
        run: go mod download
      - name: Install pinned Pkl CLI
        if: inputs.operation == 'release'
        run: |
          set -Eeuo pipefail
          pkl="$RUNNER_TEMP/pkl"
          curl --fail --silent --show-error --location \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64 \
            --output "$pkl"
          chmod 0755 "$pkl"
          "$pkl" --version | grep -E '^Pkl 0\.32\.1([[:space:]]|$)'
          echo "PKL_BIN=$pkl" >> "$GITHUB_ENV"
          echo "PKL_CACHE_DIR=$RUNNER_TEMP/pkl-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install artifact transport and pinned Vercel CLI
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/lwc-tools/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/lwc-tools" @actions/artifact@2.3.2 --ignore-scripts
          npm install --global vercel@59.11.7 --ignore-scripts
      - name: Validate Release Notes disposition input
        if: inputs.operation == 'release'
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_NOTES_ACTION" =~ ^(run|retry|skip|stop)$ ]] || {
            echo "Release Notes disposition must be run, retry, skip, or stop." >&2
            exit 1
          }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Validate retained Auth receipt before private package fetch
        id: gat4-preflight
        if: inputs.operation == 'release' && inputs.environment == 'development' && inputs.release_source_mode == 'independent' && contains(format(',{0},', inputs.components), ',auth,')
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_REPOSITORY_ID: ${{ inputs.auth_repository_id }}
          AUTH_REVISION: ${{ inputs.auth_revision }}
          AUTH_TREE_SHA256: ${{ inputs.auth_tree_sha256 }}
          AUTH_ARTIFACT_ID: ${{ inputs.auth_artifact_id }}
          AUTH_RUN_ID: ${{ inputs.auth_run_id }}
          AUTH_RUN_ATTEMPT: ${{ inputs.auth_run_attempt }}
        with:
          operation: auth-preflight
          auth-schema-version: ${{ inputs.auth_schema_version }}
      - name: Download and verify immutable GateAuth CI package
        id: gateauth-source
        if: inputs.operation == 'release' && inputs.environment == 'development' && inputs.release_source_mode == 'independent' && contains(format(',{0},', inputs.components), ',auth,') && steps.gat4-preflight.outputs.needs_auth_ci_package == 'true'
        env:
          GATEAUTH_SOURCE_READ_TOKEN: ${{ secrets.GATEAUTH_SOURCE_READ_TOKEN }}
          AUTH_REPOSITORY_ID: ${{ inputs.auth_repository_id }}
          AUTH_REVISION: ${{ inputs.auth_revision }}
          AUTH_TREE_SHA256: ${{ inputs.auth_tree_sha256 }}
          AUTH_ARTIFACT_ID: ${{ inputs.auth_artifact_id }}
          AUTH_RUN_ID: ${{ inputs.auth_run_id }}
          AUTH_RUN_ATTEMPT: ${{ inputs.auth_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$AUTH_REPOSITORY_ID" =~ ^[1-9][0-9]*$ && "$AUTH_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
             "$AUTH_RUN_ID" =~ ^[1-9][0-9]*$ && "$AUTH_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ &&
             "$AUTH_REVISION" =~ ^[0-9a-f]{40}$ && "$AUTH_TREE_SHA256" =~ ^sha256:[0-9a-f]{64}$ &&
             "$AUTH_REPOSITORY_ID" != "$GITHUB_REPOSITORY_ID" ]] || {
            echo "Independent Auth source inputs are incomplete or malformed." >&2
            exit 1
          }
          package="$RUNNER_TEMP/gateauth-ci-package.zip"
          envelope="$RUNNER_TEMP/gateauth-ci-envelope.json"
          python3 deploy/engine/gat4_ci_artifact.py download \
            --repository-id "$AUTH_REPOSITORY_ID" --revision "$AUTH_REVISION" \
            --tree-sha256 "$AUTH_TREE_SHA256" --artifact-id "$AUTH_ARTIFACT_ID" \
            --run-id "$AUTH_RUN_ID" --run-attempt "$AUTH_RUN_ATTEMPT" \
            --package "$package" --envelope "$envelope"
          printf 'GATEAUTH_CI_PACKAGE_PATH=%s\n' "$package" >> "$GITHUB_ENV"
          printf 'GATEAUTH_CI_ENVELOPE_PATH=%s\n' "$envelope" >> "$GITHUB_ENV"
      - name: Resolve explicit receipt references and prepare selected artifacts
        if: inputs.operation == 'release'
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          AUTH_REPOSITORY_ID: ${{ inputs.auth_repository_id }}
          AUTH_REVISION: ${{ inputs.auth_revision }}
          AUTH_TREE_SHA256: ${{ inputs.auth_tree_sha256 }}
          AUTH_ARTIFACT_ID: ${{ inputs.auth_artifact_id }}
          AUTH_RUN_ID: ${{ inputs.auth_run_id }}
          AUTH_RUN_ATTEMPT: ${{ inputs.auth_run_attempt }}
        with:
          operation: prepare
          auth-schema-version: ${{ inputs.auth_schema_version }}
      - name: Publish ready stage barrier
        if: inputs.operation == 'release'
        id: ready
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-ready-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: error
      - name: Resolve canonical BFF selection from the prepared release plan
        if: inputs.operation == 'release'
        id: release-notes-selection
        run: python3 deploy/engine/release_notes_workflow.py select-bff --plan "$RUNNER_TEMP/release/plan.json"
      - name: Record missing Notes artifact ID against exact plan
        if: inputs.operation == 'release' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry') && inputs.release_notes_artifact_id == ''
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action artifact-failure \
            --failure-class artifact-id-required --directory "$RUNNER_TEMP/release" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$OPERATION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --product-status not_started
          exit 1
      - name: Inspect exact TPM Release Notes artifact
        id: release-notes-artifact
        if: inputs.operation == 'release' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry') && inputs.release_notes_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.release_notes_artifact_id }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/release-notes-artifact.json"; then
            python3 deploy/engine/release_notes_publish.py --action artifact-failure \
              --failure-class artifact-metadata-unavailable --directory "$RUNNER_TEMP/release" \
              --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
              --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
              --artifact-id "$ARTIFACT_ID" --plan "$RUNNER_TEMP/release/plan.json" \
              --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            exit 1
          fi
          if ! run_id="$(jq -er '.workflow_run.id | select(type=="number" and .>0) | tostring' "$RUNNER_TEMP/release-notes-artifact.json")" || \
             ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || \
             ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/release-notes-run.json"; then
            python3 deploy/engine/release_notes_publish.py --action artifact-failure \
              --failure-class artifact-metadata-invalid --directory "$RUNNER_TEMP/release" \
              --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
              --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
              --artifact-id "$ARTIFACT_ID" --plan "$RUNNER_TEMP/release/plan.json" \
              --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            exit 1
          fi
          if ! python3 deploy/engine/release_notes_workflow.py validate-current-package-artifact \
            --metadata "$RUNNER_TEMP/release-notes-artifact.json" \
            --run "$RUNNER_TEMP/release-notes-run.json" \
            --artifact-id "$ARTIFACT_ID" --environment "$TARGET" --output "$GITHUB_OUTPUT"; then
            python3 deploy/engine/release_notes_publish.py --action artifact-failure \
              --failure-class artifact-metadata-invalid --directory "$RUNNER_TEMP/release" \
              --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
              --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
              --artifact-id "$ARTIFACT_ID" --plan "$RUNNER_TEMP/release/plan.json" \
              --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            exit 1
          fi
      - name: Download exact TPM Release Notes artifact
        id: release-notes-download
        if: inputs.operation == 'release' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry') && inputs.release_notes_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.release_notes_artifact_id }}
          run-id: ${{ steps.release-notes-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-notes-package
          merge-multiple: true
      - name: Record exact TPM artifact download failure
        if: inputs.operation == 'release' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry') && inputs.release_notes_artifact_id != '' && steps.release-notes-download.outcome != 'success'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action artifact-failure \
            --failure-class artifact-download-failed --directory "$RUNNER_TEMP/release" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --plan "$RUNNER_TEMP/release/plan.json" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          exit 1
      - name: Record explicit Notes stop
        if: inputs.operation == 'release' && inputs.release_notes_action == 'stop'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action stop \
            --directory "$RUNNER_TEMP/release" --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$OPERATION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --product-status not_started
          echo "Explicit Notes stop selected; no product mutation will run." >&2
          exit 1
      - name: Record explicit Notes skip before release
        if: inputs.operation == 'release' && inputs.release_notes_action == 'skip'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action skip-before-release \
            --directory "$RUNNER_TEMP/release" --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$OPERATION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --product-status not_started
      - name: Validate and store immutable Release Notes content before product release
        if: inputs.operation == 'release' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry')
        env:
          NOTES_ARTIFACT_DIGEST: ${{ steps.release-notes-artifact.outputs.digest }}
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action prepare \
            --directory "$RUNNER_TEMP/release" --package-dir "$RUNNER_TEMP/release-notes-package" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --artifact-digest "$NOTES_ARTIFACT_DIGEST" \
            --artifact-metadata-digest "$NOTES_ARTIFACT_DIGEST" --plan "$RUNNER_TEMP/release/plan.json" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --product-status not_started
      - name: Validate explicit recovery inputs
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ['OPERATION'] in ('deploy', 'rollback', 'reactivate', 'tag', 'readback')
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['ARTIFACT_ID'])
          PY
      - name: Download pinned ready artifact or checkpoint
        if: inputs.operation != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/engine/artifacts.cjs download "$ARTIFACT_ID" "$RUNNER_TEMP/release"
      - name: Validate pinned workflow interface
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import json, os
          import re
          p=json.load(open(os.environ['RUNNER_TEMP']+'/release/plan.json'))
          assert p['normalized']['environment']==os.environ['TARGET']
          assert p['source']==os.environ['SOURCE'] and p['tag']==os.environ['RELEASE_TAG']
          assert os.environ['OPERATION'] in ('release','deploy','rollback','reactivate','tag','readback')
          if os.environ.get('REJECTION_ARTIFACT_ID'):
              assert re.fullmatch(r'[1-9][0-9]*', os.environ['REJECTION_ARTIFACT_ID'])
              assert os.environ['TARGET'] == 'development'
              assert os.environ['OPERATION'] == 'deploy'
              assert os.environ['COMPONENTS'] == 'frontend'
          if os.environ.get('FORCE') == 'true':
              assert os.environ['TARGET'] == 'development'
              assert os.environ['OPERATION'] in ('release','deploy')
          PY
      - name: Resolve canonical BFF selection for recovery marker
        if: inputs.operation != 'release'
        id: recovery-notes-selection
        run: python3 deploy/engine/release_notes_workflow.py select-bff --plan "$RUNNER_TEMP/release/plan.json"
      - name: Execute bounded runtime or explicit recovery
        id: deployment
        if: inputs.operation != 'release' || inputs.release_notes_action != 'stop'
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        with:
          operation: runtime
          force: ${{ inputs.force }}
      - name: Retain original product publication time
        if: inputs.operation == 'release' && steps.deployment.outcome == 'success' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry')
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action record-publication \
            --directory "$RUNNER_TEMP/release" --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$OPERATION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --product-status released --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Publish Notes content and exact current-operation marker
        if: inputs.operation == 'release' && steps.deployment.outcome == 'success' && (inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry')
        env:
          NOTES_ARTIFACT_DIGEST: ${{ steps.release-notes-artifact.outputs.digest }}
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_capture.py --directory "$RUNNER_TEMP/release" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --release-notes-action "$RELEASE_NOTES_ACTION" --product-status released \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --artifact-digest "$NOTES_ARTIFACT_DIGEST"
          python3 deploy/engine/release_notes_publish.py --action publish \
            --directory "$RUNNER_TEMP/release" --package-dir "$RUNNER_TEMP/release-notes-package" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --artifact-digest "$NOTES_ARTIFACT_DIGEST" \
            --artifact-metadata-digest "$NOTES_ARTIFACT_DIGEST" --plan "$RUNNER_TEMP/release/plan.json" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --product-status released
      - name: Publish current-operation marker after explicit Notes skip
        if: inputs.operation == 'release' && steps.deployment.outcome == 'success' && inputs.release_notes_action == 'skip'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_capture.py --directory "$RUNNER_TEMP/release" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --release-notes-action skip --product-status released --artifact-id "$RELEASE_NOTES_ARTIFACT_ID"
          python3 deploy/engine/release_notes_publish.py --action skip \
            --directory "$RUNNER_TEMP/release" --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --plan "$RUNNER_TEMP/release/plan.json" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --product-status released
      - name: Publish marker for explicit BFF deploy, rollback, or reactivation
        if: (inputs.operation == 'deploy' || inputs.operation == 'rollback' || inputs.operation == 'reactivate') && steps.recovery-notes-selection.outputs.bff_selected == 'true' && steps.deployment.outcome == 'success'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_capture.py --directory "$RUNNER_TEMP/release" \
            --operation "$OPERATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --release-notes-action marker --product-status released
          python3 deploy/engine/release_notes_publish.py --action marker \
            --directory "$RUNNER_TEMP/release" --environment "${{ inputs.environment == 'production' && 'prod' || 'dev' }}" \
            --bucket "${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$OPERATION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --product-status released
      - name: Retain final result even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-result-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: warn

  notes-resend:
    if: inputs.operation == 'notes-resend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
      RESULT_ENVIRONMENT: ${{ inputs.environment }}
      NOTES_BUCKET: ${{ inputs.environment == 'production' && 'llm-wiki-data' || 'llm-wiki-data-dev' }}
      RELEASE_NOTES_ARTIFACT_ID: ${{ inputs.release_notes_artifact_id }}
      RELEASE_NOTES_RESULT_ARTIFACT_ID: ${{ inputs.release_notes_result_artifact_id }}
      RELEASE_NOTES_ACTION: ${{ inputs.release_notes_action }}
      RELEASE_NOTES_OPERATION: ${{ inputs.release_notes_operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          persist-credentials: false
      - name: Validate Notes resend identity inputs
        env:
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
          [[ "$RELEASE_NOTES_RESULT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_NOTES_ACTION" =~ ^(run|retry|skip|stop)$ ]]
          if [[ "$RELEASE_NOTES_ACTION" == run || "$RELEASE_NOTES_ACTION" == retry ]]; then
            [[ "$RELEASE_NOTES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$RELEASE_NOTES_OPERATION" =~ ^(release|deploy|rollback|reactivate|promote)$ ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned artifact transport
        run: |
          set -Eeuo pipefail
          echo "NODE_PATH=$RUNNER_TEMP/lwc-tools/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/lwc-tools" @actions/artifact@2.3.2 --ignore-scripts
      - name: Inspect exact prior release result artifact
        id: notes-result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_NOTES_RESULT_ARTIFACT_ID" > "$RUNNER_TEMP/notes-result-metadata.json"
          name="$(jq -er '.name | select(type=="string")' "$RUNNER_TEMP/notes-result-metadata.json")"
          run_id="$(jq -er '.workflow_run.id | select(type=="number" and .>0) | tostring' "$RUNNER_TEMP/notes-result-metadata.json")"
          attempt="$(jq -er '.name | capture("^lwc-result-(?<env>development|production)-(?<run>[0-9]+)-(?<attempt>[0-9]+)$").attempt' "$RUNNER_TEMP/notes-result-metadata.json")"
          [[ "$name" == "lwc-result-$RESULT_ENVIRONMENT-$run_id-$attempt" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/notes-result-run.json"
          jq -e '.event == "workflow_dispatch" and (.conclusion == "success" or .conclusion == "failure")' "$RUNNER_TEMP/notes-result-run.json" >/dev/null
          printf 'run_id=%s\nattempt=%s\n' "$run_id" "$attempt" >> "$GITHUB_OUTPUT"
      - name: Download exact prior release result and retained operation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/engine/artifacts.cjs download-result "$RELEASE_NOTES_RESULT_ARTIFACT_ID" "$RUNNER_TEMP/release" "$RESULT_ENVIRONMENT"
      - name: Verify the retained product operation succeeded
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action verify-operation \
            --directory "$RUNNER_TEMP/release" --environment "$TARGET_ENVIRONMENT" --bucket "$NOTES_BUCKET" \
            --plan "$RUNNER_TEMP/release/plan.json" --result-artifact-id "$RELEASE_NOTES_RESULT_ARTIFACT_ID" \
            --operation "$RELEASE_NOTES_OPERATION" --run-id "${{ steps.notes-result.outputs.run_id }}" \
            --run-attempt "${{ steps.notes-result.outputs.attempt }}" --product-status released
      - name: Inspect exact TPM Release Notes artifact
        id: notes-package
        if: inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_NOTES_ARTIFACT_ID" > "$RUNNER_TEMP/notes-package-metadata.json"
          run_id="$(jq -er '.workflow_run.id | select(type=="number" and .>0) | tostring' "$RUNNER_TEMP/notes-package-metadata.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/notes-package-run.json"
          python3 deploy/engine/release_notes_workflow.py validate-resend-package-artifact \
            --metadata "$RUNNER_TEMP/notes-package-metadata.json" \
            --run "$RUNNER_TEMP/notes-package-run.json" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" \
            --result-artifact-id "$RELEASE_NOTES_RESULT_ARTIFACT_ID" \
            --operation "$RELEASE_NOTES_OPERATION" --output "$GITHUB_OUTPUT"
      - name: Download exact TPM Release Notes artifact
        if: inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.release_notes_artifact_id }}
          run-id: ${{ steps.notes-package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-notes-package
          merge-multiple: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        if: inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry'
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        if: inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry'
      - name: Resend Notes without product deployment
        if: inputs.release_notes_action == 'run' || inputs.release_notes_action == 'retry'
        env:
          NOTES_ARTIFACT_DIGEST: ${{ steps.notes-package.outputs.digest }}
          NOTES_ARTIFACT_NAME: ${{ steps.notes-package.outputs.artifact_name }}
          NOTES_PACKAGE_RUN_ID: ${{ steps.notes-package.outputs.package_run_id }}
          NOTES_PACKAGE_RUN_ATTEMPT: ${{ steps.notes-package.outputs.package_run_attempt }}
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action resend \
            --directory "$RUNNER_TEMP/release" --package-dir "$RUNNER_TEMP/release-notes-package" \
            --environment "$TARGET_ENVIRONMENT" --bucket "$NOTES_BUCKET" \
            --artifact-id "$RELEASE_NOTES_ARTIFACT_ID" --artifact-digest "$NOTES_ARTIFACT_DIGEST" \
            --artifact-metadata-digest "$NOTES_ARTIFACT_DIGEST" --plan "$RUNNER_TEMP/release/plan.json" \
            --artifact-name "$NOTES_ARTIFACT_NAME" --package-run-id "$NOTES_PACKAGE_RUN_ID" \
            --package-run-attempt "$NOTES_PACKAGE_RUN_ATTEMPT" \
            --result-artifact-id "$RELEASE_NOTES_RESULT_ARTIFACT_ID" \
            --operation "$RELEASE_NOTES_OPERATION" --run-id "${{ steps.notes-result.outputs.run_id }}" \
            --run-attempt "${{ steps.notes-result.outputs.attempt }}" --product-status released
      - name: Record explicit Notes skip without product deployment
        if: inputs.release_notes_action == 'skip'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action skip-after-release \
            --directory "$RUNNER_TEMP/release" --environment "$TARGET_ENVIRONMENT" --bucket "$NOTES_BUCKET" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$RELEASE_NOTES_OPERATION" \
            --result-artifact-id "$RELEASE_NOTES_RESULT_ARTIFACT_ID" \
            --run-id "${{ steps.notes-result.outputs.run_id }}" \
            --run-attempt "${{ steps.notes-result.outputs.attempt }}" --product-status released
      - name: Record explicit Notes stop without product deployment
        if: inputs.release_notes_action == 'stop'
        run: |
          set -Eeuo pipefail
          python3 deploy/engine/release_notes_publish.py --action stop \
            --directory "$RUNNER_TEMP/release" --environment "$TARGET_ENVIRONMENT" --bucket "$NOTES_BUCKET" \
            --plan "$RUNNER_TEMP/release/plan.json" --operation "$RELEASE_NOTES_OPERATION" \
            --result-artifact-id "$RELEASE_NOTES_RESULT_ARTIFACT_ID" \
            --run-id "${{ steps.notes-result.outputs.run_id }}" \
            --run-attempt "${{ steps.notes-result.outputs.attempt }}" --product-status released
      - name: Retain independent Notes resend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes-resend-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: warn

  pipeline-config-only:
    if: inputs.operation == 'config-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: read
      id-token: write
    env:
      LWC_PIPELINE_RUN_TIMEOUT_SECONDS: ${{ inputs.pipeline_run_timeout_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          persist-credentials: false
      - name: Validate executor checkout
        env:
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - name: Install pinned Pkl CLI
        run: |
          set -Eeuo pipefail
          pkl="$RUNNER_TEMP/pkl"
          curl --fail --silent --show-error --location \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64 \
            --output "$pkl"
          chmod 0755 "$pkl"
          "$pkl" --version | grep -E '^Pkl 0\.32\.1([[:space:]]|$)'
          echo "PKL_BIN=$pkl" >> "$GITHUB_ENV"
          echo "PKL_CACHE_DIR=$RUNNER_TEMP/pkl-cache" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Generate and deliver selected Pipeline config without replacing image
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 deploy/engine/pipeline_config_only.py --environment "$TARGET_ENVIRONMENT"

  frontend-config-only:
    if: inputs.operation == 'frontend-config-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
      FRONTEND_CONFIG_ARTIFACT_ID: ${{ inputs.frontend_config_artifact_id }}
      EXECUTOR_SHA: ${{ inputs.executor_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.executor_sha }}
          persist-credentials: false

      - name: Validate executor checkout
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"

      - name: Inspect exact selected artifact and successful generator run
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$FRONTEND_CONFIG_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "frontend_config_artifact_id is required for frontend-config-only" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FRONTEND_CONFIG_ARTIFACT_ID" \
            > "$RUNNER_TEMP/frontend-config-artifact-metadata.json"
          run_id="$(jq -er '.workflow_run.id | select(type == "number" and . > 0) | tostring' \
            "$RUNNER_TEMP/frontend-config-artifact-metadata.json")"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$RUNNER_TEMP/frontend-config-run-metadata.json"
          python3 scripts/frontend_config_artifacts.py inspect \
            --artifact-metadata "$RUNNER_TEMP/frontend-config-artifact-metadata.json" \
            --run-metadata "$RUNNER_TEMP/frontend-config-run-metadata.json" \
            --artifact-id "$FRONTEND_CONFIG_ARTIFACT_ID" \
            --environment "$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Download exact artifact ID from its generation run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.frontend_config_artifact_id }}
          run-id: ${{ steps.inspect.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frontend-config
          merge-multiple: true

      - name: Validate selected artifact metadata and public JSON bytes
        id: validate_artifact
        env:
          SOURCE_SHA: ${{ steps.inspect.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          config_sha="$(python3 scripts/frontend_config_artifacts.py validate \
            --directory "$RUNNER_TEMP/frontend-config" \
            --environment "$TARGET_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA")"
          [[ "$config_sha" =~ ^[a-f0-9]{64}$ ]]
          echo "config_sha256=$config_sha" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Publish only the selected public config and verify exact readback
        env:
          SOURCE_SHA: ${{ steps.inspect.outputs.source_sha }}
          GENERATION_RUN_ID: ${{ steps.inspect.outputs.run_id }}
          CONFIG_SHA256: ${{ steps.validate_artifact.outputs.config_sha256 }}
        run: |
          set -Eeuo pipefail
          case "$TARGET_ENVIRONMENT" in
            dev) object_uri='gs://llm-wiki-frontend-config-dev/frontend-config.json' ;;
            prod) object_uri='gs://llm-wiki-frontend-config-prod/frontend-config.json' ;;
            *) echo "Unsupported Frontend config environment" >&2; exit 1 ;;
          esac
          config_file="$RUNNER_TEMP/frontend-config/frontend-config.json"
          gcloud storage cp --cache-control=no-store --content-type=application/json \
            "$config_file" "$object_uri"
          generation="$(gcloud storage objects describe "$object_uri" --format='value(generation)')"
          [[ "$generation" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/frontend-config-readback"
          gcloud storage cp "$object_uri" "$RUNNER_TEMP/frontend-config-readback/frontend-config.json"
          cmp --silent "$config_file" "$RUNNER_TEMP/frontend-config-readback/frontend-config.json"
          readback_sha="$(sha256sum "$RUNNER_TEMP/frontend-config-readback/frontend-config.json" | cut -d ' ' -f 1)"
          [[ "$readback_sha" == "$CONFIG_SHA256" ]]
          jq -n \
            --arg artifact_id "$FRONTEND_CONFIG_ARTIFACT_ID" \
            --arg generation_run_id "$GENERATION_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg object_uri "$object_uri" \
            --arg object_generation "$generation" \
            --arg config_sha256 "$readback_sha" \
            '{artifact_id:$artifact_id,generation_run_id:$generation_run_id,source_sha:$source_sha,environment:$environment,object_uri:$object_uri,object_generation:$object_generation,config_sha256:$config_sha256}' \
            > "$RUNNER_TEMP/frontend-config-publish-evidence.json"
          {
            echo "### Frontend public config published"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Selected artifact ID: \`$FRONTEND_CONFIG_ARTIFACT_ID\`"
            echo "- Generation run: \`$GENERATION_RUN_ID\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Object generation: \`$generation\`"
            echo "- Readback SHA-256: \`$readback_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain public config publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-config-publish-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-config-publish-evidence.json
          if-no-files-found: error
          retention-days: 90
