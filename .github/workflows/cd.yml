name: Deployment engine r2
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string
        description: Deployment source SHA; a DEV Stage 1 resume supplies the retained plan source while executor_sha remains the current reviewed checkout
      release_source_mode:
        required: true
        type: string
        description: Explicit receipt mode; legacy_monorepo supports retained receipts and the current same-repository GAT-4 DEV stage; this does not change Production policy
      auth_repository_id:
        required: false
        type: number
        default: 0
        description: Immutable GitHub repository ID for the independent GateAuth source
      auth_revision:
        required: false
        type: string
        default: ''
        description: Full GateAuth source commit SHA
      auth_tree_sha256:
        required: false
        type: string
        default: ''
        description: SHA-256 of the clean GateAuth source tree
      auth_artifact_id:
        required: false
        type: number
        default: 0
        description: Source artifact ID from the successful GateAuth workflow run
      auth_run_id:
        required: false
        type: number
        default: 0
        description: Successful GateAuth workflow run ID which produced the source artifact
      auth_run_attempt:
        required: false
        type: number
        default: 0
        description: Successful GateAuth workflow run attempt
      executor_sha:
        required: true
        type: string
      components:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      operation:
        type: string
        default: release
        description: Select normal deployment, Pipeline config-only, or public Frontend config-only publication
      artifact_id:
        type: string
        default: ''
      dev_artifact_id:
        type: string
        default: ''
      frontend_config_artifact_id:
        type: string
        default: ''
        description: Exact successful artifact ID from Generate Frontend Public Config
      force:
        type: boolean
        default: false
      pipeline_run_timeout_seconds:
        type: string
        default: ''
        description: Verified existing Pipeline Job timeout in seconds; required for worker config generation
concurrency:
  group: lwc-engine-${{ inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: inputs.operation != 'diagnose-auth-image' && inputs.operation != 'config-only' && inputs.operation != 'frontend-config-only'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      TARGET: ${{ inputs.environment }}
      SOURCE: ${{ inputs.source_sha }}
      EXECUTOR_SHA: ${{ inputs.executor_sha }}
      GAT4_RELEASE_SOURCE_MODE: ${{ inputs.release_source_mode }}
      GAT4_DEV_RECEIPT_MODE: ${{ inputs.release_source_mode }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      COMPONENTS: ${{ inputs.components }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REUSE_ID: ${{ inputs.artifact_id }}
      DEV_ID: ${{ inputs.dev_artifact_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      OPERATION: ${{ inputs.operation }}
      FORCE: ${{ inputs.force }}
      LWC_PIPELINE_RUN_TIMEOUT_SECONDS: ${{ inputs.pipeline_run_timeout_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate executor checkout
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
      - name: Download and verify immutable GateAuth CI package
        id: gateauth-source
        if: inputs.operation == 'release' && inputs.environment == 'development' && inputs.release_source_mode == 'independent' && contains(format(',{0},', inputs.components), ',auth,')
        env:
          GATEAUTH_SOURCE_READ_TOKEN: ${{ secrets.GATEAUTH_SOURCE_READ_TOKEN }}
          AUTH_REPOSITORY_ID: ${{ inputs.auth_repository_id }}
          AUTH_REVISION: ${{ inputs.auth_revision }}
          AUTH_TREE_SHA256: ${{ inputs.auth_tree_sha256 }}
          AUTH_ARTIFACT_ID: ${{ inputs.auth_artifact_id }}
          AUTH_RUN_ID: ${{ inputs.auth_run_id }}
          AUTH_RUN_ATTEMPT: ${{ inputs.auth_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$AUTH_REPOSITORY_ID" =~ ^[1-9][0-9]*$ && "$AUTH_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
             "$AUTH_RUN_ID" =~ ^[1-9][0-9]*$ && "$AUTH_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ &&
             "$AUTH_REVISION" =~ ^[0-9a-f]{40}$ && "$AUTH_TREE_SHA256" =~ ^sha256:[0-9a-f]{64}$ &&
             "$AUTH_REPOSITORY_ID" != "$GITHUB_REPOSITORY_ID" ]] || {
            echo "Independent Auth source inputs are incomplete or malformed." >&2
            exit 1
          }
          package="$RUNNER_TEMP/gateauth-ci-package.zip"
          envelope="$RUNNER_TEMP/gateauth-ci-envelope.json"
          python3 deploy/engine/gat4_ci_artifact.py download \
            --repository-id "$AUTH_REPOSITORY_ID" --revision "$AUTH_REVISION" \
            --tree-sha256 "$AUTH_TREE_SHA256" --artifact-id "$AUTH_ARTIFACT_ID" \
            --run-id "$AUTH_RUN_ID" --run-attempt "$AUTH_RUN_ATTEMPT" \
            --package "$package" --envelope "$envelope"
          printf 'GATEAUTH_CI_PACKAGE_PATH=%s\n' "$package" >> "$GITHUB_ENV"
          printf 'GATEAUTH_CI_ENVELOPE_PATH=%s\n' "$envelope" >> "$GITHUB_ENV"
      - name: Select independent DEV receipt producer
        if: inputs.environment == 'development' && inputs.release_source_mode == 'independent'
        run: echo "GAT4_DEV_RECEIPT_SOURCE_METADATA_FILE=$RUNNER_TEMP/release/dev-source-metadata.json" >> "$GITHUB_ENV"
      - name: Validate retained Stage 1 source input
        if: inputs.operation == 'release' && inputs.environment == 'development' && inputs.source_sha != github.sha
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || {
            echo "An explicit DEV Stage 1 source requires its retained artifact_id." >&2
            exit 1
          }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: inputs.operation == 'release'
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - name: Install pinned Pkl CLI
        if: inputs.operation == 'release'
        run: |
          set -Eeuo pipefail
          pkl="$RUNNER_TEMP/pkl"
          curl --fail --silent --show-error --location \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64 \
            --output "$pkl"
          chmod 0755 "$pkl"
          "$pkl" --version | grep -E '^Pkl 0\.32\.1([[:space:]]|$)'
          echo "PKL_BIN=$pkl" >> "$GITHUB_ENV"
          echo "PKL_CACHE_DIR=$RUNNER_TEMP/pkl-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install artifact transport and pinned Vercel CLI
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/lwc-tools/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/lwc-tools" @actions/artifact@2.3.2 --ignore-scripts
          npm install --global vercel@59.11.7 --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Resolve explicit receipt references and prepare selected artifacts
        if: inputs.operation == 'release'
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          AUTH_REPOSITORY_ID: ${{ inputs.auth_repository_id }}
          AUTH_REVISION: ${{ inputs.auth_revision }}
          AUTH_TREE_SHA256: ${{ inputs.auth_tree_sha256 }}
          AUTH_ARTIFACT_ID: ${{ inputs.auth_artifact_id }}
          AUTH_RUN_ID: ${{ inputs.auth_run_id }}
          AUTH_RUN_ATTEMPT: ${{ inputs.auth_run_attempt }}
        with:
          operation: prepare
      - name: Publish ready stage barrier
        if: inputs.operation == 'release'
        id: ready
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-ready-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: error
      - name: Validate explicit recovery inputs
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ['OPERATION'] in ('deploy', 'rollback', 'reactivate', 'tag', 'readback')
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['ARTIFACT_ID'])
          PY
      - name: Download pinned ready artifact or checkpoint
        if: inputs.operation != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/engine/artifacts.cjs download "$ARTIFACT_ID" "$RUNNER_TEMP/release"
      - name: Validate pinned workflow interface
        if: inputs.operation != 'release'
        run: |
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/release/plan.json'))
          assert p['normalized']['environment']==os.environ['TARGET']
          assert p['source']==os.environ['SOURCE'] and p['tag']==os.environ['RELEASE_TAG']
          assert os.environ['OPERATION'] in ('release','deploy','rollback','reactivate','tag','readback')
          if os.environ.get('FORCE') == 'true':
              assert os.environ['TARGET'] == 'development'
              assert os.environ['OPERATION'] in ('release','deploy')
          PY
      - name: Execute bounded runtime or explicit recovery
        uses: ./.github/actions/deployment-engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        with:
          operation: runtime
          force: ${{ inputs.force }}
      - name: Retain final result even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lwc-result-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: warn

  pipeline-config-only:
    if: inputs.operation == 'config-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: read
      id-token: write
    env:
      LWC_PIPELINE_RUN_TIMEOUT_SECONDS: ${{ inputs.pipeline_run_timeout_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.executor_sha }}
          persist-credentials: false
      - name: Validate executor checkout
        env:
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - name: Install pinned Pkl CLI
        run: |
          set -Eeuo pipefail
          pkl="$RUNNER_TEMP/pkl"
          curl --fail --silent --show-error --location \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64 \
            --output "$pkl"
          chmod 0755 "$pkl"
          "$pkl" --version | grep -E '^Pkl 0\.32\.1([[:space:]]|$)'
          echo "PKL_BIN=$pkl" >> "$GITHUB_ENV"
          echo "PKL_CACHE_DIR=$RUNNER_TEMP/pkl-cache" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Generate and deliver selected Pipeline config without replacing image
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 deploy/engine/pipeline_config_only.py --environment "$TARGET_ENVIRONMENT"

  frontend-config-only:
    if: inputs.operation == 'frontend-config-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment == 'production' && 'Production' || 'Development' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
      FRONTEND_CONFIG_ARTIFACT_ID: ${{ inputs.frontend_config_artifact_id }}
      EXECUTOR_SHA: ${{ inputs.executor_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.executor_sha }}
          persist-credentials: false

      - name: Validate executor checkout
        run: test "$(git rev-parse HEAD)" = "$EXECUTOR_SHA"

      - name: Inspect exact selected artifact and successful generator run
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$FRONTEND_CONFIG_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "frontend_config_artifact_id is required for frontend-config-only" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FRONTEND_CONFIG_ARTIFACT_ID" \
            > "$RUNNER_TEMP/frontend-config-artifact-metadata.json"
          run_id="$(jq -er '.workflow_run.id | select(type == "number" and . > 0) | tostring' \
            "$RUNNER_TEMP/frontend-config-artifact-metadata.json")"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$RUNNER_TEMP/frontend-config-run-metadata.json"
          python3 scripts/frontend_config_artifacts.py inspect \
            --artifact-metadata "$RUNNER_TEMP/frontend-config-artifact-metadata.json" \
            --run-metadata "$RUNNER_TEMP/frontend-config-run-metadata.json" \
            --artifact-id "$FRONTEND_CONFIG_ARTIFACT_ID" \
            --environment "$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Download exact artifact ID from its generation run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.frontend_config_artifact_id }}
          run-id: ${{ steps.inspect.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frontend-config
          merge-multiple: true

      - name: Validate selected artifact metadata and public JSON bytes
        id: validate_artifact
        env:
          SOURCE_SHA: ${{ steps.inspect.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          config_sha="$(python3 scripts/frontend_config_artifacts.py validate \
            --directory "$RUNNER_TEMP/frontend-config" \
            --environment "$TARGET_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA")"
          [[ "$config_sha" =~ ^[a-f0-9]{64}$ ]]
          echo "config_sha256=$config_sha" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Publish only the selected public config and verify exact readback
        env:
          SOURCE_SHA: ${{ steps.inspect.outputs.source_sha }}
          GENERATION_RUN_ID: ${{ steps.inspect.outputs.run_id }}
          CONFIG_SHA256: ${{ steps.validate_artifact.outputs.config_sha256 }}
        run: |
          set -Eeuo pipefail
          case "$TARGET_ENVIRONMENT" in
            dev) object_uri='gs://llm-wiki-frontend-config-dev/frontend-config.json' ;;
            prod) object_uri='gs://llm-wiki-frontend-config-prod/frontend-config.json' ;;
            *) echo "Unsupported Frontend config environment" >&2; exit 1 ;;
          esac
          config_file="$RUNNER_TEMP/frontend-config/frontend-config.json"
          gcloud storage cp --cache-control=no-store --content-type=application/json \
            "$config_file" "$object_uri"
          generation="$(gcloud storage objects describe "$object_uri" --format='value(generation)')"
          [[ "$generation" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/frontend-config-readback"
          gcloud storage cp "$object_uri" "$RUNNER_TEMP/frontend-config-readback/frontend-config.json"
          cmp --silent "$config_file" "$RUNNER_TEMP/frontend-config-readback/frontend-config.json"
          readback_sha="$(sha256sum "$RUNNER_TEMP/frontend-config-readback/frontend-config.json" | cut -d ' ' -f 1)"
          [[ "$readback_sha" == "$CONFIG_SHA256" ]]
          jq -n \
            --arg artifact_id "$FRONTEND_CONFIG_ARTIFACT_ID" \
            --arg generation_run_id "$GENERATION_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg object_uri "$object_uri" \
            --arg object_generation "$generation" \
            --arg config_sha256 "$readback_sha" \
            '{artifact_id:$artifact_id,generation_run_id:$generation_run_id,source_sha:$source_sha,environment:$environment,object_uri:$object_uri,object_generation:$object_generation,config_sha256:$config_sha256}' \
            > "$RUNNER_TEMP/frontend-config-publish-evidence.json"
          {
            echo "### Frontend public config published"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Selected artifact ID: \`$FRONTEND_CONFIG_ARTIFACT_ID\`"
            echo "- Generation run: \`$GENERATION_RUN_ID\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Object generation: \`$generation\`"
            echo "- Readback SHA-256: \`$readback_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain public config publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-config-publish-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-config-publish-evidence.json
          if-no-files-found: error
          retention-days: 90
