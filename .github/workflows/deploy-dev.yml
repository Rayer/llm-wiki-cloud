name: Deploy Development
run-name: ${{ inputs.prepare_release_notes_package && format('Prepare Release Notes package {0}', inputs.release_notes_package_request_id) || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated selected components; config-only targets Worker and frontend-config-only publishes a public config artifact
        required: false
        type: string
      release_tag:
        description: Explicit immutable release tag; not used by config-only
        required: false
        type: string
      release_version:
        description: Explicit public product release version; included in the immutable release plan and never inferred from the tag or BFF build
        required: false
        type: string
        default: ''
      artifact_id:
        description: Optional retained artifact ID for reuse
        type: string
        default: ''
      release_notes_artifact_id:
        description: Exact retained TPM-authored private Release Notes package artifact ID
        type: string
        default: ''
      release_notes_action:
        description: Explicit Notes subphase choice; retry/skip are bound to this release plan, stop ends before product mutation
        required: true
        type: choice
        options: [run, retry, skip, stop]
        default: run
      release_notes_result_artifact_id:
        description: Exact retained release result artifact ID for operation notes-resend or historical Notes package preparation
        type: string
        default: ''
      release_notes_operation:
        description: Original retained runtime operation used by notes-resend or historical Notes package preparation
        required: false
        type: choice
        options: [release, deploy, rollback, reactivate, promote]
        default: release
      dev_artifact_id:
        description: Explicit successful DEV result artifact (required for Production containers)
        type: string
        default: ''
      frontend_config_artifact_id:
        description: Exact successful public Frontend config artifact ID; required for frontend-config-only
        type: string
        default: ''
      source_sha:
        description: Original source SHA for retained Stage 1 resume or recovery; leave blank for a normal release using this workflow's github.sha
        type: string
        default: ''
      force:
        description: Explicitly accept duplicate-mutation risk to deploy a new ready attempt past another attempt's unresolved target status
        type: boolean
        default: false
      operation:
        description: Config-only updates Pipeline settings; frontend-config-only publishes the selected public Frontend config without rebuilding; frontend-config-generate prepares an immutable public config artifact
        required: true
        type: choice
        options: [release, config-only, frontend-config-only, frontend-config-generate, deploy, rollback, reactivate, tag, readback, notes-resend, diagnose-auth-image]
        default: release
      pipeline_run_timeout_seconds:
        description: Verified existing Worker Job timeout in seconds; required for Pipeline config generation
        type: string
        default: ''
      release_source_mode:
        description: DEV receipt mode; legacy_monorepo builds versioned gateauth/ from this LWC source for the current GAT-4 DEV stage or reuses a retained legacy receipt
        required: true
        type: choice
        options: [independent, legacy_monorepo]
        default: independent
      auth_schema_version:
        description: Auth runtime input schema for DEV; schema 3 is limited to independent Auth-only DEV or BFF-only staging with a retained schema-3 Auth receipt
        required: true
        type: choice
        options: ['4', '3']
        default: '4'
      auth_repository_id:
        description: Immutable GateAuth GitHub repository ID, required when an independent Auth build is selected
        type: number
        default: 0
      auth_revision:
        description: Full GateAuth commit SHA from the successful source workflow
        type: string
        default: ''
      auth_tree_sha256:
        description: SHA-256 digest of the clean GateAuth source tree
        type: string
        default: ''
      auth_artifact_id:
        description: Source artifact ID from the successful GateAuth workflow run
        type: number
        default: 0
      auth_run_id:
        description: Successful GateAuth workflow run ID
        type: number
        default: 0
      auth_run_attempt:
        description: Successful GateAuth workflow run attempt
        type: number
        default: 0
      prepare_release_notes_package:
        description: Prepare a TPM-authored private Notes package from an exact retained Ready or successful historical DEV result; skips every deployment operation
        required: false
        type: boolean
        default: false
      package_zip_base64:
        description: Private bounded base64 ZIP of the existing TPM-authored Notes package; consumed from this dispatch event file only
        required: false
        type: string
        default: ''
      release_notes_package_retention_days:
        description: Retention for the private package artifact
        required: false
        type: choice
        options: ['30', '90']
        default: '90'
      release_notes_package_request_id:
        description: Unique lowercase 32-hex correlation value for private package preparation
        required: false
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  prepare-release-notes-package:
    if: inputs.prepare_release_notes_package == true
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/prepare-release-notes-package.yml
    with:
      ready_artifact_id: ${{ inputs.artifact_id }}
      history_result_artifact_id: ${{ inputs.release_notes_result_artifact_id }}
      history_operation: ${{ inputs.release_notes_result_artifact_id != '' && inputs.release_notes_operation || '' }}
      retention_days: ${{ inputs.release_notes_package_retention_days }}
      request_id: ${{ inputs.release_notes_package_request_id }}
  release:
    if: github.ref == 'refs/heads/develop' && inputs.prepare_release_notes_package != true && inputs.operation != 'diagnose-auth-image' && inputs.operation != 'frontend-config-generate'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      environment: development
      source_sha: ${{ inputs.operation == 'release' && (inputs.source_sha || github.sha) || inputs.source_sha }}
      executor_sha: ${{ github.sha }}
      components: ${{ inputs.components }}
      release_tag: ${{ inputs.release_tag }}
      release_version: ${{ inputs.release_version }}
      release_source_mode: ${{ inputs.release_source_mode }}
      auth_schema_version: ${{ inputs.auth_schema_version }}
      auth_repository_id: ${{ fromJSON(inputs.auth_repository_id) }}
      auth_revision: ${{ inputs.auth_revision }}
      auth_tree_sha256: ${{ inputs.auth_tree_sha256 }}
      auth_artifact_id: ${{ fromJSON(inputs.auth_artifact_id) }}
      auth_run_id: ${{ fromJSON(inputs.auth_run_id) }}
      auth_run_attempt: ${{ fromJSON(inputs.auth_run_attempt) }}
      artifact_id: ${{ inputs.artifact_id }}
      dev_artifact_id: ${{ inputs.dev_artifact_id }}
      release_notes_artifact_id: ${{ inputs.release_notes_artifact_id }}
      release_notes_result_artifact_id: ${{ inputs.release_notes_result_artifact_id }}
      release_notes_action: ${{ inputs.release_notes_action }}
      release_notes_operation: ${{ inputs.release_notes_operation }}
      frontend_config_artifact_id: ${{ inputs.frontend_config_artifact_id }}
      operation: ${{ inputs.operation }}
      force: ${{ inputs.force }}
      pipeline_run_timeout_seconds: ${{ inputs.pipeline_run_timeout_seconds }}
  frontend-config-generate:
    if: github.ref == 'refs/heads/develop' && inputs.prepare_release_notes_package != true && inputs.operation == 'frontend-config-generate'
    permissions:
      contents: read
    uses: ./.github/workflows/generate-frontend-config.yml
    with:
      environment: dev
  auth-image-diagnostic:
    if: >-
      inputs.operation == 'diagnose-auth-image' &&
      inputs.prepare_release_notes_package != true &&
      github.ref == 'refs/heads/develop' &&
      inputs.components == 'auth' &&
      inputs.release_tag == 'diagnostic-36992147920' &&
      inputs.artifact_id == 'diagnostic-no-receipt' &&
      inputs.dev_artifact_id == ''
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/cd-auth-image-diagnostic.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
  main-fast-forward-eligible:
    name: main-fast-forward-eligible
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      inputs.prepare_release_notes_package != true &&
      inputs.components != 'provision-exportjob-dev' &&
      inputs.operation != 'diagnose-auth-image' &&
      inputs.operation != 'config-only' &&
      inputs.operation != 'frontend-config-only' &&
      inputs.operation != 'frontend-config-generate' &&
      inputs.operation != 'readback'
      && inputs.operation != 'notes-resend'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Publish pending eligibility status
        id: publish_pending_eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=main-fast-forward-eligible \
            -f description='Waiting for exact develop head validation' >/dev/null

      - name: Download this DEV attempt result
        id: download_result
        if: needs.release.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lwc-result-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-result

      - name: Checkout exact candidate
        id: checkout_exact_candidate
        if: needs.release.result == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate formal DEV result and exact main fast-forward eligibility
        id: validate_eligibility
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.release.result }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SOURCE: ${{ inputs.operation == 'release' && (inputs.source_sha || github.sha) || inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPONENTS: ${{ inputs.components }}
          RESULT_DIR: ${{ runner.temp }}/dev-result
          RESULT_DOWNLOAD_OUTCOME: ${{ steps.download_result.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_exact_candidate.outcome }}
          PENDING_OUTCOME: ${{ steps.publish_pending_eligibility.outcome }}
        run: |
          set -Eeuo pipefail

          [[ "$DEPLOY_RESULT" == success ]] || exit 1
          [[ "$OPERATION" != readback ]] || exit 1
          [[ "$RESULT_DOWNLOAD_OUTCOME" == success ]] || exit 1
          [[ "$CHECKOUT_OUTCOME" == success ]] || exit 1
          [[ "$PENDING_OUTCOME" == success ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RESULT_DIR'])
          plan = json.loads((root / 'plan.json').read_text())
          state = json.loads((root / 'state.json').read_text())
          result = json.loads((root / 'result.json').read_text())
          requested = os.environ['COMPONENTS'].split(',')
          if (not plan.get('id') or plan.get('source') != os.environ['EXPECTED_SOURCE'] or
                  plan.get('tag') != os.environ['RELEASE_TAG'] or
                  plan.get('branch') != 'develop' or
                  plan.get('normalized', {}).get('environment') != 'development' or
                  sorted(plan.get('selected', [])) != sorted(requested) or
                  state.get('plan') != plan['id'] or state.get('status') != 'success' or
                  state.get('executor_sha') != os.environ['GITHUB_SHA'] or
                  result.get('attempt') != plan['id'] or
                  result.get('release') != os.environ['RELEASE_TAG'] or
                  result.get('expected', {}).get('source') != plan['source'] or
                  result.get('status') != 'success' or result.get('stage') != 'success' or
                  result.get('reason') != 'completed' or
                  result.get('last_verified_checkpoint') != state.get('sequence')):
              raise SystemExit('formal DEV result/state is not a successful current attempt')
          PY

          checked_out_sha="$(git rev-parse --verify HEAD)"
          [[ "$checked_out_sha" == "$GITHUB_SHA" ]] || exit 1

          remote_head() {
            local branch="$1" head
            head="$(gh api --jq '.object.sha' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}")"
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$head"
          }

          current_develop="$(remote_head develop)"
          [[ "$current_develop" == "$GITHUB_SHA" ]] || exit 1
          current_main="$(remote_head main)"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$current_main" ]] || exit 1
          git merge-base --is-ancestor "$current_main" "$GITHUB_SHA" || exit 1
          [[ "$(remote_head develop)" == "$GITHUB_SHA" ]] || exit 1

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=main-fast-forward-eligible \
            -f description='Exact successful DEV result is eligible for main fast-forward' >/dev/null

      - name: Publish eligibility failure status
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=main-fast-forward-eligible \
            -f description='Exact DEV result or develop/main fast-forward validation failed' >/dev/null
