name: Deploy Development
on:
  workflow_dispatch:
    inputs:
      components:
        description: Comma-separated selected components
        required: true
        type: string
      release_tag:
        description: Explicit immutable release tag
        required: true
        type: string
      artifact_id:
        description: Optional retained artifact ID for reuse
        type: string
        default: ''
      dev_artifact_id:
        description: Explicit successful DEV result artifact (required for Production containers)
        type: string
        default: ''
      source_sha:
        description: Retained release source SHA for explicit recovery; normal release uses this workflow's github.sha
        type: string
        default: ''
      force:
        description: Explicitly accept duplicate-mutation risk to deploy a new ready attempt past another attempt's unresolved target status
        type: boolean
        default: false
      operation:
        description: Normal release by default; recovery operations consume a pinned retained artifact
        required: true
        type: choice
        options: [release, deploy, rollback, reactivate, tag, readback, diagnose-auth-image]
        default: release
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/develop' && inputs.operation != 'diagnose-auth-image'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      environment: development
      source_sha: ${{ inputs.operation == 'release' && github.sha || inputs.source_sha }}
      executor_sha: ${{ github.sha }}
      components: ${{ inputs.components }}
      release_tag: ${{ inputs.release_tag }}
      artifact_id: ${{ inputs.artifact_id }}
      dev_artifact_id: ${{ inputs.dev_artifact_id }}
      operation: ${{ inputs.operation }}
      force: ${{ inputs.force }}
  auth-image-diagnostic:
    if: >-
      inputs.operation == 'diagnose-auth-image' &&
      github.ref == 'refs/heads/develop' &&
      inputs.components == 'auth' &&
      inputs.release_tag == 'diagnostic-36992147920' &&
      inputs.artifact_id == 'diagnostic-no-receipt' &&
      inputs.dev_artifact_id == ''
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/cd-auth-image-diagnostic.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
