name: Provision DEV Export Job prerequisites

on:
  workflow_call:
    inputs:
      continuation_run_id:
        required: false
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Development
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact develop source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful canonical CI for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&event=push&branch=develop&per_page=100")"
          run_id="$(jq -er --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "push" and
              .head_branch == "develop" and .head_sha == $sha and .status == "completed" and .conclusion == "success")]
            | if length == 1 then .[0].id else error("expected one successful exact-SHA canonical CI run") end
          ' <<<"$runs")"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          jq -e '
            [.jobs[] | select(.name == "canonical-ci" and .status == "completed" and .conclusion == "success")]
            | length == 1
          ' <<<"$jobs" >/dev/null

      - name: Restore latest evidence for this DEV SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CONTINUATION_RUN_ID: ${{ inputs.continuation_run_id }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$CONTINUATION_RUN_ID" ]]; then
            [[ "$CONTINUATION_RUN_ID" =~ ^[0-9]+$ ]]
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CONTINUATION_RUN_ID}/artifacts?per_page=100")"
            name="$(jq -er --arg run "$CONTINUATION_RUN_ID" '
              [.artifacts[] | select(.expired == false and
                (.name | test("^exportjob-dev-provision-[0-9a-f]{40}-" + $run + "-[1-9][0-9]*$")))]
              | if length == 1 then .[0].name else error("expected one exact prior DEV provisioning artifact") end
            ' <<<"$artifacts")"
            mkdir -p "$RUNNER_TEMP/exportjob-prior-evidence"
            gh run download "$CONTINUATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/exportjob-prior-evidence"
            prior_file="$(find "$RUNNER_TEMP/exportjob-prior-evidence" -type f -name exportjob-dev-evidence.json -print -quit)"
            [[ -n "$prior_file" ]]
            mkdir -p .provision
            cp "$prior_file" .provision/exportjob-dev-prior-evidence.json
            exit 0
          fi
          prefix="exportjob-dev-provision-${SOURCE_SHA}-"
          artifacts="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"
          prior="$(jq -r --arg prefix "$prefix" '
            [.[].artifacts[] | select(.name | startswith($prefix))] | sort_by(.created_at) | last // empty
          ' <<<"$artifacts")"
          if [[ -n "$prior" ]]; then
            run_id="$(jq -er '.workflow_run.id' <<<"$prior")"
            name="$(jq -er '.name' <<<"$prior")"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/exportjob-prior-evidence"
            prior_file="$(find "$RUNNER_TEMP/exportjob-prior-evidence" -type f -name exportjob-dev-evidence.json -print -quit)"
            [[ -n "$prior_file" ]]
            mkdir -p .provision
            cp "$prior_file" .provision/exportjob-dev-evidence.json
          fi

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.1.4

      - name: Authenticate with the existing DEV deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: llm-wiki-cloud
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Verify owner prerequisites, build reviewed source, and deploy DEV Job
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          CONTINUATION_RUN_ID: ${{ inputs.continuation_run_id }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$CONTINUATION_RUN_ID" ]]; then
            python3 deploy/provision/exportjob_dev.py \
              --continue-existing-job-evidence .provision/exportjob-dev-prior-evidence.json \
              --continuation-run-id "$CONTINUATION_RUN_ID" \
              --owner-source-sha 466b54a358c5d6a9274d9c085078fc7dd2a1b938
          else
            python3 deploy/provision/exportjob_dev.py
          fi

      - name: Upload provisioning and inverse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exportjob-dev-provision-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .provision/exportjob-dev-evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
