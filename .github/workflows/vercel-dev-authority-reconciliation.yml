name: Vercel DEV Authority Reconciliation

# This workflow is intentionally separate from the steady-state DEV lane. GitHub only
# exposes workflow_dispatch for workflow files registered on the repository default branch;
# this reviewed develop change prepares the path for the separate main registration PR.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character lowercase canonical develop SHA with successful CI
        required: true
        type: string
      ci_run_id:
        description: Exact successful push CI run ID for this SHA on develop
        required: true
        type: number
      expected_new_project_id:
        description: Exact canonical DEV project ID approved for this reconciliation
        required: true
        type: string
      expected_team_id:
        description: Exact Vercel team ID approved for this reconciliation
        required: true
        type: string
      expected_current_alias_project_id:
        description: Exact owner project ID currently holding the fixed DEV alias
        required: true
        type: string
      expected_current_alias_deployment_id:
        description: Exact deployment ID currently holding the fixed DEV alias
        required: true
        type: string
      expected_current_alias_source_sha:
        description: Exact source SHA of the current alias deployment
        required: true
        type: string
      ticket_ref:
        description: Must be exactly LWC-253
        required: true
        type: string
      reconciliation_ack:
        description: Exact approval phrase binding ticket, fixed alias, old authority, new project/team, desired SHA, CI run, and create flag
        required: true
        type: string
      create_if_missing:
        description: Whether one canonical deployment may be created when no exact candidate exists
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-development-deployment
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile the bounded DEV authority
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Development
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      EXPECTED_NEW_PROJECT_ID: ${{ inputs.expected_new_project_id }}
      EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
      CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
      EXPECTED_CURRENT_ALIAS_PROJECT_ID: ${{ inputs.expected_current_alias_project_id }}
      EXPECTED_CURRENT_ALIAS_DEPLOYMENT_ID: ${{ inputs.expected_current_alias_deployment_id }}
      EXPECTED_CURRENT_ALIAS_SOURCE_SHA: ${{ inputs.expected_current_alias_source_sha }}
      TICKET_REF: ${{ inputs.ticket_ref }}
      RECONCILIATION_ACK: ${{ inputs.reconciliation_ack }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out the exact requested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested SHA, remote develop, and canonical CI
        shell: bash
        run: bash .github/scripts/vercel-dev-authority-reconciliation.sh validate
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-dev-authority-reconciliation
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install pinned Vercel CLI
        shell: bash
        run: npm install --global vercel@52.0.0 --ignore-scripts

      - name: Read-only reconciliation preflight
        id: reconciliation_preflight
        shell: bash
        run: bash .github/scripts/vercel-dev-authority-reconciliation.sh preflight
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-dev-authority-reconciliation
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload durable reconciliation rollback contract
        id: reconciliation_rollback_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-authority-reconciliation-rollback-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/vercel-dev-authority-reconciliation/reconciliation-rollback-contract.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Reconciliation promote (first mutation-capable step)
        if: steps.reconciliation_preflight.outcome == 'success' && steps.reconciliation_rollback_upload.outcome == 'success'
        shell: bash
        run: bash .github/scripts/vercel-dev-authority-reconciliation.sh promote
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-dev-authority-reconciliation
          GITHUB_RUN_ID: ${{ github.run_id }}
          RECONCILIATION_ARTIFACT_NAME: vercel-authority-reconciliation-rollback-${{ inputs.commit_sha }}
          ROLLBACK_ARTIFACT_ID: ${{ steps.reconciliation_rollback_upload.outputs.artifact-id }}
          ROLLBACK_ARTIFACT_URL: ${{ steps.reconciliation_rollback_upload.outputs.artifact-url }}
          ROLLBACK_ARTIFACT_DIGEST: ${{ steps.reconciliation_rollback_upload.outputs.artifact-digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload normalized reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-authority-reconciliation-evidence-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/vercel-dev-authority-reconciliation/vercel-authority-reconciliation.json
          retention-days: 90
          if-no-files-found: error
