name: Vercel Production Auth Environment Configuration

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character lowercase SHA on canonical develop with successful CI
        required: true
        type: string
      ticket_ref:
        description: Exact ticket reference for this owner-authorized cutover
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production-auth-environment
  cancel-in-progress: false

jobs:
  configure:
    name: Configure the production auth origin
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Development
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      TICKET_REF: ${{ inputs.ticket_ref }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_API_URL: https://api.github.com
      VERCEL_API_BASE_URL: https://api.vercel.com
      ROLLBACK_ARTIFACT_NAME: vercel-production-auth-env-rollback-${{ inputs.commit_sha }}
      ORIGINATING_WORKFLOW: vercel-production-auth-env.yml
      ORIGINATING_WORKFLOW_RUN_ID: ${{ github.run_id }}
      ORIGINATING_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the exact requested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact develop SHA and canonical CI
        shell: bash
        run: bash .github/scripts/vercel-production-auth-env.sh validate
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-production-auth-env
          GITHUB_TOKEN: ${{ github.token }}

      - name: Preflight production auth environment and capture rollback
        shell: bash
        run: bash .github/scripts/vercel-production-auth-env.sh preflight
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-production-auth-env
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_API_BASE_URL: https://api.vercel.com
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload durable production auth rollback contract
        id: rollback_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-production-auth-env
        with:
          name: ${{ env.ROLLBACK_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}/rollback-contract.json
          retention-days: 90
          if-no-files-found: error

      - name: Apply and verify production auth environment
        if: steps.rollback_upload.outcome == 'success'
        shell: bash
        run: bash .github/scripts/vercel-production-auth-env.sh mutate
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-production-auth-env
          GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_ARTIFACT_ID: ${{ steps.rollback_upload.outputs.artifact-id }}
          ROLLBACK_ARTIFACT_URL: ${{ steps.rollback_upload.outputs.artifact-url }}
          ROLLBACK_ARTIFACT_DIGEST: ${{ steps.rollback_upload.outputs.artifact-digest }}
          VERCEL_API_BASE_URL: https://api.vercel.com
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload normalized production auth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/vercel-production-auth-env
        with:
          name: vercel-production-auth-env-evidence-${{ inputs.commit_sha }}
          path: ${{ env.EVIDENCE_DIR }}/vercel-production-auth-env.json
          retention-days: 90
          if-no-files-found: error
