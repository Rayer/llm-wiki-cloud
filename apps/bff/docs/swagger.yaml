securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token issued by the standalone Auth service. Format:
      \"Bearer <token>\".'
    in: header
    name: Authorization
    type: apiKey
  ProjectHeader:
    description: Project identifier header.
    in: header
    name: X-Project-ID
    type: apiKey
swagger: "2.0"
