info:
  contact:
    name: LLM Wiki Team
  description: Backend-for-frontend API for the LLM Wiki project. Serves wiki sources
    and concepts with full-text search, import, and pipeline status.
  title: LLM Wiki BFF API
  version: "1.0"
paths:
  /api/v1/admin/projects:
    get:
      consumes:
      - application/json
      description: Returns all projects from Firestore. Supports optional ?user_id
        query filter.
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all projects (admin)
      tags:
      - admin
  /api/v1/admin/projects/{id}:
    delete:
      consumes:
      - application/json
      description: 'Deletes a project: removes GCS data, Firestore project doc, and
        lock doc.'
      parameters:
      - description: Project doc ID ({userID}_{projectID})
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a project (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Updates the name field on a Firestore project document. The JSON
        body is limited to 1024 bytes; name is trimmed and must be 1-64 Unicode code
        points.
      parameters:
      - description: Project doc ID ({userID}_{projectID})
        in: path
        name: id
        required: true
        type: string
      - description: New project name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.renameProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.adminRenameProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename a project (admin)
      tags:
      - admin
  /api/v1/admin/projects/{id}/pipeline:
    post:
      consumes:
      - application/json
      description: Invokes the Cloud Run worker job for the specified project. Optional
        clean_rebuild/stage overrides may be provided in the JSON request body.
      parameters:
      - description: Project doc ID ({userID}_{projectID})
        in: path
        name: id
        required: true
        type: string
      - description: Optional pipeline stage and clean rebuild flags
        in: body
        name: body
        schema:
          $ref: '#/definitions/v1.adminPipelineTriggerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v1.adminPipelineTriggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Trigger pipeline for a project (admin)
      tags:
      - admin
  /api/v1/admin/projects/{id}/pipeline/status:
    get:
      description: Returns the exact Cloud Run execution for the requested project.
        Ownership mismatches return not found.
      parameters:
      - description: Project doc ID ({userID}_{projectID})
        in: path
        name: id
        required: true
        type: string
      - description: Cloud Run execution ID
        in: query
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.adminPipelineStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
