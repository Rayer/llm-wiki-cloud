  /api/v1/public/config:
    get:
      description: Returns registration and Demo sign-in capabilities plus the currently
        published announcement Markdown.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/syssettings.PublicSettings'
      summary: Public runtime config
      tags:
      - public
  /api/v1/public/version:
    get:
      description: Returns allowlisted product build metadata and Cloud Run identity.
        This response never includes image digests, environment variables, credentials,
        project IDs, or user IDs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              type: string
          schema:
            $ref: '#/definitions/buildinfo.Info'
      summary: Build and deployment identity
      tags:
      - public
  /api/v1/query:
    post:
      consumes:
      - application/json
      description: Full-text search across sources and concepts. Mode "wiki" returns
        raw results, "full" adds AI-synthesized answer. Model-prior full responses
        with insufficient_evidence/no_qualified_evidence include citations:[] and
        the model-prior evidence metadata; legacy nil citations remain omitted.
      parameters:
      - description: Search query and mode
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.QueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      - ProjectHeader: []
      summary: Search wiki content
      tags:
      - search
  /api/v1/raw/scrape:
    post:
      consumes:
      - application/json
      description: Scrape a URL into markdown and save it under the scoped raw store.
      parameters:
      - description: URL and optional filename
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ScrapeRequest'
