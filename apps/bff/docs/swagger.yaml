    post:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Project ID; must match the URL
        in: header
        name: X-Project-ID
        required: true
        type: string
      - description: Expected revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.profileRevisionRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ProfileState'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.profileConflictResponse'
        "428":
          description: Precondition Required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retry failed Profile derivation
      tags:
      - profile
  /api/v1/projects/{projectID}/profile/jobs/{jobID}:
    get:
      parameters:
      - description: Project ID
